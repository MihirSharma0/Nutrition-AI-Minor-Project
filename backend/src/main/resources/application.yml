spring:
  application:
    name: nutrition-api
  config:
    import: optional:file:.env[.properties]
  
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${OTP_VERIFICATION_EMAIL}
    password: ${OTP_VERIFICATION_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  
  datasource:
    url: jdbc:mysql://localhost:3306/nutrition_db?createDatabaseIfNotExist=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080
  error:
    include-message: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.web: INFO
    com.nutrition: DEBUG
    org.hibernate.SQL: DEBUG

app:
  frontend:
    login-url: ${FRONTEND_LOGIN_URL:https://your-domain.com/login}
