<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>OTP Verification</title>
</head>

<body style="font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px;">
    <div
        style="max-w-md; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <h2 style="color: #333;">Welcome to Nutrition AI, <span th:text="${name}">User</span>!</h2>
        <p style="color: #666; font-size: 16px;">Please use the following One-Time Password (OTP) to verify your
            account.</p>

        <div
            style="background-color: #e6f7ff; border: 1px solid #91d5ff; padding: 15px; text-align: center; border-radius: 4px; margin: 20px 0;">
            <h1 style="color: #1890ff; margin: 0; letter-spacing: 5px;" th:text="${otp}">000000</h1>
        </div>

        <p style="color: #666; font-size: 14px;">This code will expire in 15 minutes.</p>

        <div style="margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; font-size: 12px; color: #999;">
            <p>If you didn't request this, please ignore this email.</p>
            <p>Nutrition AI Team<br />
        </div>
    </div>
</body>

</html>
